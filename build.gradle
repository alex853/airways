plugins {
    id 'java'
    id 'org.springframework.boot' version '2.7.14'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'net.simforge'
version = repositoryVersion

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
    // simforge libraries live in the repo (maven layout with poms, so transitive dependencies resolve); no external repo
    maven {
        url uri('libs')
    }
}

// the poms of the libraries ask for RELEASE of each other: pin them to the versions in libs/
def simforgeVersions = [
        'simforge-commons'   : '1.2.0',
        'simforge-atmosphere': '1.1.0',
        'refdata-aircrafts'  : '1.6.0',
        'refdata-airports'   : '3.1.4',
        'network-view-core'  : '1.2.11',
]
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'net.simforge' && simforgeVersions.containsKey(details.requested.name)) {
            details.useVersion simforgeVersions[details.requested.name]
        }
    }
}

dependencies {
    implementation 'net.simforge:simforge-commons:1.2.0'
    implementation 'net.simforge:refdata-aircrafts:1.6.0'
    implementation 'net.simforge:refdata-airports:3.1.4'
    implementation 'net.simforge:network-view-core:1.2.11'

    compileOnly 'org.projectlombok:lombok:1.18.22'
    annotationProcessor 'org.projectlombok:lombok:1.18.22'

    implementation "com.google.guava:guava:33.3.1-jre"
//    implementation group: 'commons-collections', name: 'commons-collections', version: '3.2.2'
    implementation "com.google.code.gson:gson:2.13.1"

    implementation "org.sqids:sqids:0.1.0"

    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    // the live list of the avatars is a file outside of the classpath: the tests read the seed of the resources, a folder which is not there, and never the file of a developer
    systemProperty 'airways.avatars.folder', "${buildDir}/avatars-not-there"
}
